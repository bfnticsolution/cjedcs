<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atelier · Rédiger un prompt parfait — NTIC Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
:root {
    --bleu: #0B3FA5;
    --bleu-profond: #072a6e;
    --bleu-clair: #e8f0fe;
    --orange: #FF6B35;
    --orange-clair: #fff4e5;
    --vert: #059669;
    --vert-clair: #ecfdf5;
    --violet: #7c3aed;
    --violet-clair: #f3e8ff;
    --rouge: #dc2626;
    --rouge-clair: #fef2f2;
    --jaune: #f59e0b;
    --jaune-clair: #fffbeb;
    --texte: #1e293b;
    --texte-secondaire: #475569;
    --blanc: #ffffff;
    --bordure: #e2e8f0;
    --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: var(--texte);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    -webkit-font-smoothing: antialiased;
}
.access-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: linear-gradient(135deg, var(--violet) 0%, #4c1d95 100%);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.7s ease, visibility 0.7s ease;
}
.access-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.access-card {
    background: var(--blanc); border-radius: 2rem; padding: 3rem 2.5rem;
    text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    max-width: 440px; width: 90%; animation: floatIn 0.8s ease;
}
@keyframes floatIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.access-card .logo-symbol {
    background: var(--violet); color: white; width: 68px; height: 68px;
    border-radius: 18px; display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; margin: 0 auto 1.2rem;
}
.access-card h2 { color: var(--violet); font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 800; }
.access-card p { color: var(--texte-secondaire); margin-bottom: 1.8rem; font-size: 0.92rem; line-height: 1.5; }
.access-input {
    width: 100%; padding: 0.9rem 1.3rem; border: 2px solid var(--bordure);
    border-radius: 14px; font-family: inherit; font-size: 1rem;
    text-align: center; letter-spacing: 2px; transition: var(--transition); margin-bottom: 1rem;
}
.access-input:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 4px rgba(124,58,237,0.15); }
.access-btn {
    width: 100%; padding: 0.9rem; background: var(--violet); color: white;
    border: none; border-radius: 14px; font-weight: 700; font-size: 1rem;
    font-family: inherit; cursor: pointer; transition: var(--transition);
}
.access-btn:hover { background: #6d28d9; transform: translateY(-2px); }
.access-error { color: var(--rouge); font-size: 0.85rem; margin-top: 0.5rem; display: none; font-weight: 600; }
.access-error.visible { display: block; animation: shake 0.5s ease; }
@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}
.presentation-container { display: none; position: fixed; inset: 0; background: #0d1117; z-index: 100; }
.presentation-container.active { display: block; }
.slide-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.slide-content {
    background: white; width: 100%; height: 100%;
    overflow-y: auto; padding: 3rem 4.5rem;
    position: relative; animation: slideIn 0.4s ease;
}
@keyframes slideIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
}
.slide-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
    padding: 0.6rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--bordure); font-size: 0.8rem; font-weight: 600;
}
.slide-header .bloc-tag {
    background: var(--violet); color: white; padding: 0.25rem 0.75rem;
    border-radius: 999px; font-size: 0.7rem; letter-spacing: 0.5px;
}
.slide-header .type-tag {
    padding: 0.25rem 0.75rem; border-radius: 999px;
    font-size: 0.7rem; letter-spacing: 0.5px; font-weight: 700;
}
.type-cours { background: var(--bleu-clair); color: var(--bleu); }
.type-pratique { background: var(--vert-clair); color: var(--vert); }
.type-exercice { background: var(--orange-clair); color: var(--orange); }
.type-synthese { background: var(--violet-clair); color: var(--violet); }
.slide-header .num { color: var(--texte-secondaire); }
.nav-hint {
    position: fixed; bottom: 1rem; right: 1rem; z-index: 500;
    color: rgba(255,255,255,0.3); font-size: 0.7rem;
    font-weight: 600; letter-spacing: 0.5px; pointer-events: none;
}
.anim-item { opacity: 0; transform: translateY(15px); animation: fadeUp 0.5s ease forwards; }
.anim-item:nth-child(1) { animation-delay: 0.05s; }
.anim-item:nth-child(2) { animation-delay: 0.15s; }
.anim-item:nth-child(3) { animation-delay: 0.25s; }
.anim-item:nth-child(4) { animation-delay: 0.35s; }
.anim-item:nth-child(5) { animation-delay: 0.45s; }
.anim-item:nth-child(6) { animation-delay: 0.55s; }
.anim-item:nth-child(7) { animation-delay: 0.65s; }
.anim-item:nth-child(8) { animation-delay: 0.75s; }
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; color: var(--bleu); line-height: 1.1; }
h2 { font-size: 2.1rem; font-weight: 700; color: var(--bleu); line-height: 1.2; margin-bottom: 1rem; }
h3 { font-size: 1.4rem; font-weight: 700; color: var(--texte); }
h4 { font-size: 1.15rem; font-weight: 700; }
p { font-size: 1.25rem; line-height: 1.55; color: var(--texte); }
li { font-size: 1.15rem; line-height: 1.65; }
.lead { font-size: 1.4rem; color: var(--texte-secondaire); line-height: 1.5; }
.slide-title {
    background: linear-gradient(135deg, var(--violet) 0%, #4c1d95 100%);
    color: white; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
}
.slide-title h1 { color: white; font-size: 3.2rem; }
.slide-title .lead { color: rgba(255,255,255,0.9); margin-top: 1rem; }
.slide-title .meta { color: rgba(255,255,255,0.65); font-size: 1rem; margin-top: 2rem; letter-spacing: 1px; }
.slide-title .badge-top {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
    padding: 0.4rem 1.1rem; border-radius: 999px; font-size: 0.8rem;
    font-weight: 700; letter-spacing: 1.5px; margin-bottom: 1.5rem;
}
.cours-content { max-width: 1050px; margin: 0 auto; }
.cours-content h2 { margin-bottom: 1.2rem; }
.cours-content p { margin-bottom: 1rem; }
.cours-content ul { padding-left: 1.5rem; margin-bottom: 1rem; }
.cours-content li { margin-bottom: 0.4rem; }
pre {
    background: #1e293b; color: #e2e8f0;
    padding: 1.3rem 1.5rem; border-radius: 12px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.95rem; line-height: 1.7;
    overflow-x: auto; margin: 1rem 0;
    border-left: 4px solid var(--violet);
    white-space: pre-wrap; word-wrap: break-word;
}
pre .com { color: #64748b; font-style: italic; }
pre .kw { color: #f472b6; font-weight: 600; }
code {
    background: #f1f5f9; padding: 0.15rem 0.4rem;
    border-radius: 4px; font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.9em; color: #db2777;
}
.box {
    border-radius: 12px; padding: 1rem 1.4rem; margin: 1rem 0;
    font-size: 1.05rem; border-left: 5px solid;
    display: flex; align-items: flex-start; gap: 0.7rem;
}
.box i { font-size: 1.2rem; flex-shrink: 0; margin-top: 0.15rem; }
.box-tip { background: var(--bleu-clair); border-color: var(--bleu); color: #0a2c5c; }
.box-important { background: var(--orange-clair); border-color: var(--orange); color: #6b3a1f; }
.box-success { background: var(--vert-clair); border-color: var(--vert); color: #064e3b; }
.box-warning { background: var(--rouge-clair); border-color: var(--rouge); color: #7f1d1d; }
.box-info { background: var(--violet-clair); border-color: var(--violet); color: #3b0764; }
.slide-pratique { background: #f0fdf4; }
.slide-exercice { background: #fff7ed; }
.slide-synthese { background: #f5f3ff; }
.table-simple {
    width: 100%; border-collapse: collapse; font-size: 1rem;
    background: white; border-radius: 12px; overflow: hidden; margin: 1rem 0;
}
.table-simple th {
    background: var(--violet); color: white; padding: 0.8rem 1.1rem;
    text-align: left; font-weight: 700; font-size: 0.95rem;
}
.table-simple td { padding: 0.7rem 1.1rem; border-bottom: 1px solid var(--bordure); }
.table-simple tr:last-child td { border-bottom: none; }
.regle-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1.5rem; }
.regle-card {
    background: #f8fafc; border-radius: 12px; padding: 1.2rem;
    border-left: 5px solid var(--violet); transition: transform 0.2s;
}
.regle-card:hover { transform: translateX(4px); }
.regle-card .num {
    display: inline-block; background: var(--violet); color: white;
    width: 32px; height: 32px; border-radius: 50%;
    line-height: 32px; text-align: center;
    font-weight: 800; font-size: 0.9rem; margin-right: 0.5rem;
}
.regle-card h4 { display: inline-block; vertical-align: middle; color: var(--violet); font-size: 1.05rem; margin-bottom: 0.5rem; }
.regle-card p { font-size: 0.92rem; color: var(--texte-secondaire); margin-bottom: 0.5rem; line-height: 1.5; }
.regle-card .exemple {
    font-family: 'Consolas', monospace; font-size: 0.8rem;
    background: white; padding: 0.5rem 0.7rem;
    border-radius: 6px; border: 1px solid var(--bordure);
    color: var(--texte); line-height: 1.5;
}
.regle-card .exemple .good { color: var(--vert); font-weight: 700; }
.regle-card .exemple .bad { color: var(--rouge); font-weight: 700; }
.steps-container { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.step-item {
    display: flex; align-items: flex-start; gap: 1.2rem;
    background: white; border-radius: 14px; padding: 1.2rem 1.5rem;
    border: 2px solid var(--bordure); transition: var(--transition);
}
.step-item:hover { border-color: var(--violet); transform: translateX(4px); }
.step-num {
    width: 46px; height: 46px; border-radius: 50%;
    background: linear-gradient(135deg, var(--violet) 0%, #4c1d95 100%);
    color: white; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.2rem; flex-shrink: 0;
}
.step-body { flex: 1; }
.step-body h4 { color: var(--violet); font-size: 1.15rem; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.5rem; }
.step-body h4 i { font-size: 0.95rem; opacity: 0.7; }
.step-body p { font-size: 0.95rem; color: var(--texte-secondaire); line-height: 1.55; margin: 0; }
.step-body p strong { color: var(--texte); }
.step-body .key {
    display: inline-block; background: #1e293b; color: #86efac;
    padding: 0.15rem 0.5rem; border-radius: 5px;
    font-family: 'Consolas', monospace; font-size: 0.82rem; font-weight: 700;
}
.prompt-demo {
    background: #1e293b; color: #e2e8f0;
    padding: 1.5rem; border-radius: 12px;
    font-family: 'Consolas', monospace;
    font-size: 0.85rem; line-height: 1.7;
    max-height: 500px; overflow-y: auto;
    border-left: 4px solid var(--orange);
    white-space: pre-wrap; word-wrap: break-word;
}
.prompt-demo .section-tag {
    color: var(--orange); font-weight: 700;
    text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px;
}
@media (max-width: 768px) {
    .slide-content { padding: 2rem 1.5rem; }
    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.4rem; }
    p, li { font-size: 1rem; }
    .regle-grid { grid-template-columns: 1fr; }
    .access-card { padding: 2rem 1.5rem; }
    pre, .prompt-demo { font-size: 0.8rem; }
    .slide-header { font-size: 0.7rem; padding: 0.5rem 1rem; }
    .step-item { padding: 1rem 1.2rem; gap: 0.9rem; }
    .step-num { width: 38px; height: 38px; font-size: 1rem; }
}
</style>
</head>
<body>

<div class="access-overlay" id="accessOverlay">
    <div class="access-card">
        <div class="logo-symbol"><i class="fas fa-magic"></i></div>
        <h2>Atelier · Rédiger un prompt parfait</h2>
        <p>Formation CDEJ · NTIC Solution<br>Saisissez le code d'accès.</p>
        <input type="password" class="access-input" id="accessInput" placeholder="Code d'accès" autocomplete="off" />
        <button class="access-btn" id="accessBtn"><i class="fas fa-arrow-right"></i> Commencer</button>
        <div class="access-error" id="accessError">Code incorrect. Réessayez.</div>
    </div>
</div>

<div class="presentation-container" id="presentationContainer">
    <div class="slide-header" id="slideHeader" style="display:none;">
        <div>
            <span class="bloc-tag" id="blocTag">BLOC 1</span>
            <span class="type-tag" id="typeTag">Cours</span>
        </div>
        <div class="num"><span id="slideNum">1</span> / <span id="slideTotal">25</span></div>
    </div>
    <div class="slide-stage" id="slideStage"></div>
    <div class="nav-hint">← → · Échap pour quitter</div>
</div>

<script>
const slidesData = [

{
    type: 'title',
    bloc: '—',
    content: '\
        <div class="badge-top"><i class="fas fa-magic"></i> ATELIER PRATIQUE</div>\
        <h1>Rédiger un prompt parfait</h1>\
        <p class="lead">Comment obtenir un site professionnel de DeepSeek<br>sans savoir coder</p>\
        <p class="meta">DURÉE : 2 HEURES · NIVEAU : DÉBUTANT</p>\
    ',
    className: 'slide-title'
},

{
    type: 'cours',
    bloc: '—',
    content: '\
        <div class="cours-content">\
            <h2 class="anim-item">Aujourd\'hui, on ne code pas</h2>\
            <p class="anim-item" style="font-size:1.3rem;">On apprend quelque chose de plus puissant : <strong>commander du code à une IA</strong>.</p>\
            <div class="regle-grid" style="margin-top:2rem;">\
                <div class="regle-card anim-item" style="border-left-color:var(--rouge);">\
                    <h4 style="color:var(--rouge);"><i class="fas fa-times-circle"></i> La mauvaise approche</h4>\
                    <p>Taper « Fais-moi un site » et espérer un miracle.</p>\
                    <p style="font-size:0.85rem; margin-top:0.5rem; color:var(--rouge);"><strong>Résultat :</strong> un site générique, moche, qui ne ressemble à rien.</p>\
                </div>\
                <div class="regle-card anim-item" style="border-left-color:var(--vert);">\
                    <h4 style="color:var(--vert);"><i class="fas fa-check-circle"></i> La bonne approche</h4>\
                    <p>Décrire précisément ce qu\'on veut, section par section.</p>\
                    <p style="font-size:0.85rem; margin-top:0.5rem; color:var(--vert);"><strong>Résultat :</strong> un site professionnel, prêt à publier.</p>\
                </div>\
            </div>\
            <div class="box box-info anim-item" style="margin-top:2rem;">\
                <i class="fas fa-lightbulb"></i>\
                <div><strong>Le prompt, c\'est 80 % du résultat.</strong> Une IA est puissante, mais elle ne devine pas ce que vous voulez.</div>\
            </div>\
        </div>\
    ',
    className: ''
},

{
    type: 'pratique',
    bloc: 'BLOC 1',
    content: '\
        <div class="cours-content">\
            <h2 class="anim-item">Le workflow complet — 6 étapes</h2>\
            <p class="anim-item" style="font-size:1.2rem;">De l\'idée jusqu\'à la prévisualisation. Suivez chaque étape, une par une.</p>\
            <div class="steps-container">\
                <div class="step-item anim-item">\
                    <div class="step-num">1</div>\
                    <div class="step-body">\
                        <h4><i class="fas fa-lightbulb"></i> Avoir l\'idée du site</h4>\
                        <p>Sur papier ou dans votre tête, décidez : <strong>quel site voulez-vous créer ?</strong> (école, commerce, passion, portfolio…). Notez les <strong>sections</strong>.</p>\
                    </div>\
                </div>\
                <div class="step-item anim-item">\
                    <div class="step-num">2</div>\
                    <div class="step-body">\
                        <h4><i class="fas fa-folder-plus"></i> Créer le dossier sur le Bureau</h4>\
                        <p>Clic droit sur le Bureau → <strong>Nouveau</strong> → <strong>Dossier</strong>. Nommez-le sans espaces ni accents : <code>mon-site</code>.</p>\
                    </div>\
                </div>\
                <div class="step-item anim-item">\
                    <div class="step-num">3</div>\
                    <div class="step-body">\
                        <h4><i class="fas fa-robot"></i> Ouvrir DeepSeek et soumettre le prompt</h4>\
                        <p>Allez sur <code>chat.deepseek.com</code>. Collez votre prompt <strong>complet</strong>. Attendez la génération. <strong>Copiez tout le code</strong> (Ctrl+C).</p>\
                    </div>\
                </div>\
                <div class="step-item anim-item">\
                    <div class="step-num">4</div>\
                    <div class="step-body">\
                        <h4><i class="fas fa-code"></i> Ouvrir VS Code et charger le dossier</h4>\
                        <p><strong>File</strong> → <strong>Open Folder…</strong>. Sélectionnez le dossier <code>mon-site</code>. Cliquez sur <strong>Select Folder</strong>.</p>\
                    </div>\
                </div>\
                <div class="step-item anim-item">\
                    <div class="step-num">5</div>\
                    <div class="step-body">\
                        <h4><i class="fas fa-file-code"></i> Créer index.html et coller le code</h4>\
                        <p>Cliquez sur <strong>New File</strong> à gauche. Nommez le fichier <code>index.html</code>. Collez le code (Ctrl+V). Enregistrez (Ctrl+S).</p>\
                    </div>\
                </div>\
                <div class="step-item anim-item">\
                    <div class="step-num">6</div>\
                    <div class="step-body">\
                        <h4><i class="fas fa-play"></i> Lancer Live Server</h4>\
                        <p>En bas à droite de VS Code, cliquez sur <strong>Go Live</strong>. Le navigateur s\'ouvre avec votre site.</p>\
                    </div>\
                </div>\
            </div>\
            <div class="box box-success anim-item" style="margin-top:1.5rem;">\
                <i class="fas fa-trophy"></i>\
                <div><strong>À la fin,</strong> vous avez un site web complet dans votre navigateur.</div>\
            </div>\
        </div>\
    ',
    className: 'slide-pratique'
},

{
    type: 'cours',
    bloc: 'BLOC 1',
    content: '\
        <div class="cours-content">\
            <h2 class="anim-item">Étape 1 — Trouver l\'idée du site</h2>\
            <p class="anim-item">Avant de toucher à l\'ordinateur, <strong>réfléchissez sur papier</strong>.</p>\
            <table class="table-simple anim-item">\
                <thead><tr><th>Question</th><th>Exemple</th></tr></thead>\
                <tbody>\
                    <tr><td>Quel est le sujet ?</td><td>« Un site pour mon école primaire »</td></tr>\
                    <tr><td>Qui va le visiter ?</td><td>« Les parents d\'élèves et les enseignants »</td></tr>\
                    <tr><td>Quelles sections ?</td><td>« Accueil, Présentation, Classes, Photos, Contact »</td></tr>\
                    <tr><td>Quelles couleurs ?</td><td>« Bleu, blanc, jaune »</td></tr>\
                    <tr><td>Quels contenus ?</td><td>« Nom de l\'école, 6 classes, photos, contacts »</td></tr>\
                </tbody>\
            </table>\
            <div class="box box-tip anim-item">\
                <i class="fas fa-lightbulb"></i>\
                <div><strong>Astuce :</strong> plus vous notez de détails sur papier, plus votre prompt sera précis.</div>\
            </div>\
        </div>\
    ',
    className: ''
},

{
    type: 'cours',
    bloc: 'BLOC 1',
    content: '\
        <div class="cours-content">\
            <h2 class="anim-item">Étape 2 — Créer le dossier sur le Bureau</h2>\
            <p class="anim-item">Un dossier propre = un projet propre.</p>\
            <div class="steps-container">\
                <div class="step-item anim-item" style="border-color:var(--bleu);">\
                    <div class="step-num" style="background:var(--bleu);">A</div>\
                    <div class="step-body">\
                        <h4 style="color:var(--bleu);">Clic droit sur le Bureau</h4>\
                        <p>Sur le fond de votre Bureau Windows, faites un <strong>clic droit</strong> dans un espace vide.</p>\
                    </div>\
                </div>\
                <div class="step-item anim-item" style="border-color:var(--bleu);">\
                    <div class="step-num" style="background:var(--bleu);">B</div>\
                    <div class="step-body">\
                        <h4 style="color:var(--bleu);">Nouveau → Dossier</h4>\
                        <p>Dans le menu, cliquez sur <strong>Nouveau</strong>, puis <strong>Dossier</strong>.</p>\
                    </div>\
                </div>\

let currentSlide = 0;
const totalSlides = slidesData.length;

function renderSlide(index) {
    const stage = document.getElementById('slideStage');
    const slide = slidesData[index];
    stage.innerHTML = '<div class="slide-content ' + (slide.className || '') + '">' + slide.content + '</div>';

    const header = document.getElementById('slideHeader');
    if (slide.type === 'title') {
        header.style.display = 'none';
    } else {
        header.style.display = 'flex';
        document.getElementById('blocTag').textContent = slide.bloc || '—';
        document.getElementById('slideNum').textContent = index + 1;
        document.getElementById('slideTotal').textContent = totalSlides;

        const typeTag = document.getElementById('typeTag');
        const typeLabels = {
            'cours': 'Cours',
            'pratique': 'Pratique',
            'exercice': 'Exercice',
            'synthese': 'Synthèse'
        };
        typeTag.textContent = typeLabels[slide.type] || 'Cours';
        typeTag.className = 'type-tag type-' + (slide.type || 'cours');
    }
}

function goNext() {
    if (currentSlide < totalSlides - 1) {
        currentSlide++;
        renderSlide(currentSlide);
    }
}

function goPrev() {
    if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
    }
}

function checkAccess() {
    const input = document.getElementById('accessInput');
    const error = document.getElementById('accessError');
    const expected = 'V0VCMjAyNg==';
    const entered = btoa(input.value.trim());

    if (entered === expected) {
        document.getElementById('accessOverlay').classList.add('hidden');
        document.getElementById('presentationContainer').classList.add('active');
        renderSlide(currentSlide);
    } else {
        error.classList.add('visible');
        input.value = '';
        input.focus();
        setTimeout(function() {
            error.classList.remove('visible');
        }, 2500);
    }
}

document.getElementById('accessBtn').addEventListener('click', checkAccess);
document.getElementById('accessInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkAccess();
});

document.addEventListener('keydown', function(e) {
    const container = document.getElementById('presentationContainer');
    if (!container.classList.contains('active')) return;
    switch (e.key) {
        case 'ArrowRight':
        case ' ':
        case 'PageDown':
            e.preventDefault();
            goNext();
            break;
        case 'ArrowLeft':
        case 'PageUp':
            e.preventDefault();
            goPrev();
            break;
        case 'Escape':
            if (confirm('Quitter la projection ?')) {
                document.getElementById('presentationContainer').classList.remove('active');
                document.getElementById('accessOverlay').classList.remove('hidden');
                currentSlide = 0;
            }
            break;
    }
});

let touchStartX = 0;
document.addEventListener('touchstart', function(e) {
    touchStartX = e.changedTouches[0].screenX;
});
document.addEventListener('touchend', function(e) {
    const deltaX = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(deltaX) > 60) {
        if (deltaX < 0) goNext();
        else goPrev();
    }
});
</script>
