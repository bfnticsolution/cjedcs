<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formation CDEJ · Jour 3 — Créer et publier son site</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
:root {
    --bleu: #0B3FA5;
    --bleu-profond: #072a6e;
    --bleu-clair: #e8f0fe;
    --orange: #FF6B35;
    --orange-vif: #ff5722;
    --orange-clair: #fff4e5;
    --vert: #059669;
    --vert-clair: #ecfdf5;
    --violet: #7c3aed;
    --violet-clair: #f3e8ff;
    --rouge: #dc2626;
    --rouge-clair: #fef2f2;
    --jaune: #f59e0b;
    --jaune-clair: #fffbeb;
    --texte: #1e293b;
    --texte-secondaire: #475569;
    --blanc: #ffffff;
    --bordure: #e2e8f0;
    --transition: 0.45s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: var(--texte);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    -webkit-font-smoothing: antialiased;
    user-select: none;
}

/* ===== ACCÈS ===== */
.access-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: linear-gradient(135deg, var(--orange) 0%, #b8420c 100%);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.7s ease, visibility 0.7s ease;
}
.access-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.access-card {
    background: var(--blanc); border-radius: 2rem; padding: 3rem 2.5rem;
    text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    max-width: 440px; width: 90%; animation: floatIn 0.8s ease;
}
@keyframes floatIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.access-card .logo-symbol {
    background: var(--orange); color: white; width: 68px; height: 68px;
    border-radius: 18px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.4rem; margin: 0 auto 1.2rem;
}
.access-card h2 { color: var(--orange); font-size: 1.5rem; margin-bottom: 0.5rem; }
.access-card p { color: #475569; margin-bottom: 1.8rem; font-size: 0.92rem; line-height: 1.5; }
.access-input {
    width: 100%; padding: 0.9rem 1.3rem; border: 2px solid var(--bordure);
    border-radius: 14px; font-family: inherit; font-size: 1rem;
    text-align: center; letter-spacing: 2px; transition: var(--transition); margin-bottom: 1rem;
}
.access-input:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 4px rgba(255,107,53,0.15); }
.access-btn {
    width: 100%; padding: 0.9rem; background: var(--orange); color: white;
    border: none; border-radius: 14px; font-weight: 700; font-size: 1rem;
    font-family: inherit; cursor: pointer; transition: var(--transition);
}
.access-btn:hover { background: var(--orange-vif); transform: translateY(-2px); }
.access-error {
    color: #dc2626; font-size: 0.85rem; margin-top: 0.5rem;
    display: none; font-weight: 600;
}
.access-error.visible { display: block; animation: shake 0.5s ease; }
@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}

/* ===== PROJECTION ===== */
.presentation-container {
    display: none; position: fixed; inset: 0; background: #0d1117; z-index: 100;
}
.presentation-container.active { display: block; }
.slide-stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
}
.slide-content {
    background: white; width: 100%; height: 100%;
    overflow-y: auto; padding: 3rem 4.5rem;
    position: relative; animation: slideIn 0.4s ease;
}
@keyframes slideIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
}
.slide-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(8px);
    padding: 0.6rem 1.5rem;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--bordure);
    font-size: 0.8rem; font-weight: 600;
}
.slide-header .bloc-tag {
    background: var(--orange); color: white; padding: 0.25rem 0.75rem;
    border-radius: 999px; font-size: 0.7rem; letter-spacing: 0.5px;
}
.slide-header .type-tag {
    padding: 0.25rem 0.75rem; border-radius: 999px;
    font-size: 0.7rem; letter-spacing: 0.5px; font-weight: 700;
}
.type-cours { background: var(--bleu-clair); color: var(--bleu); }
.type-pratique { background: var(--vert-clair); color: var(--vert); }
.type-exercice { background: var(--orange-clair); color: var(--orange); }
.type-synthese { background: var(--violet-clair); color: var(--violet); }
.type-succes { background: #fef3c7; color: #b45309; }
.slide-header .num { color: var(--texte-secondaire); }

.nav-hint {
    position: fixed; bottom: 1rem; right: 1rem; z-index: 500;
    color: rgba(255,255,255,0.3); font-size: 0.7rem;
    font-weight: 600; letter-spacing: 0.5px; pointer-events: none;
}

/* ===== ANIMATIONS ===== */
.anim-item { opacity: 0; transform: translateY(15px); animation: fadeUp 0.5s ease forwards; }
.anim-item:nth-child(1) { animation-delay: 0.05s; }
.anim-item:nth-child(2) { animation-delay: 0.15s; }
.anim-item:nth-child(3) { animation-delay: 0.25s; }
.anim-item:nth-child(4) { animation-delay: 0.35s; }
.anim-item:nth-child(5) { animation-delay: 0.45s; }
.anim-item:nth-child(6) { animation-delay: 0.55s; }
.anim-item:nth-child(7) { animation-delay: 0.65s; }
.anim-item:nth-child(8) { animation-delay: 0.75s; }
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

/* ===== TYPO ===== */
h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; color: var(--bleu); line-height: 1.1; }
h2 { font-size: 2.1rem; font-weight: 700; color: var(--bleu); line-height: 1.2; margin-bottom: 1rem; }
h3 { font-size: 1.4rem; font-weight: 700; color: var(--texte); }
h4 { font-size: 1.15rem; font-weight: 700; }
p { font-size: 1.25rem; line-height: 1.55; color: var(--texte); }
li { font-size: 1.15rem; line-height: 1.65; }
.lead { font-size: 1.4rem; color: var(--texte-secondaire); line-height: 1.5; }

/* ===== SLIDE TITRE ===== */
.slide-title {
    background: linear-gradient(135deg, var(--orange) 0%, #b8420c 100%);
    color: white; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
}
.slide-title h1 { color: white; font-size: 3.4rem; }
.slide-title .lead { color: rgba(255,255,255,0.9); margin-top: 1rem; }
.slide-title .meta {
    color: rgba(255,255,255,0.65); font-size: 1rem; margin-top: 2rem;
    letter-spacing: 1px;
}
.slide-title .badge-top {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
    padding: 0.4rem 1.1rem; border-radius: 999px; font-size: 0.8rem;
    font-weight: 700; letter-spacing: 1.5px; margin-bottom: 1.5rem;
}

/* ===== SLIDE SUCCÈS ===== */
.slide-succes {
    background: linear-gradient(135deg, #059669 0%, #064e3b 100%);
    color: white; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
}
.slide-succes h1 { color: white; font-size: 3rem; }
.slide-succes .lead { color: rgba(255,255,255,0.9); margin-top: 1rem; }

/* ===== PLAN ===== */
.bloc-plan {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1rem; margin-top: 2rem;
}
.bloc-item {
    background: #f8fafc; border-radius: 16px; padding: 1.5rem 1.2rem;
    border-top: 5px solid var(--orange); text-align: left;
}
.bloc-item .num {
    font-size: 0.75rem; font-weight: 800; color: var(--orange);
    letter-spacing: 1.5px; margin-bottom: 0.5rem;
}
.bloc-item h4 { color: var(--texte); margin-bottom: 0.4rem; font-size: 1.05rem; }
.bloc-item p { font-size: 0.9rem; color: var(--texte-secondaire); }
.bloc-item .duree {
    font-size: 0.75rem; font-weight: 700; color: var(--bleu);
    margin-top: 0.6rem; display: block;
}

/* ===== COURS ===== */
.cours-content { max-width: 1050px; margin: 0 auto; }
.cours-content h2 { margin-bottom: 1.2rem; }
.cours-content p { margin-bottom: 1rem; }
.cours-content ul { padding-left: 1.5rem; margin-bottom: 1rem; }
.cours-content li { margin-bottom: 0.4rem; }

/* ===== CODE ===== */
pre {
    background: #1e293b; color: #e2e8f0;
    padding: 1.3rem 1.5rem; border-radius: 12px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 1rem; line-height: 1.65;
    overflow-x: auto; margin: 1rem 0;
    border-left: 4px solid var(--orange);
}
pre .tag { color: #7dd3fc; }
pre .attr { color: #fbbf24; }
pre .val { color: #86efac; }
pre .txt { color: #e2e8f0; }
pre .com { color: #64748b; font-style: italic; }
pre .sel { color: #f472b6; }
pre .prop { color: #7dd3fc; }
pre .kw { color: #f472b6; font-weight: 600; }
pre .str { color: #86efac; }
code {
    background: #f1f5f9; padding: 0.15rem 0.4rem;
    border-radius: 4px; font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.9em; color: #db2777;
}

/* ===== BOXES ===== */
.box {
    border-radius: 12px; padding: 1rem 1.4rem; margin: 1rem 0;
    font-size: 1.05rem; border-left: 5px solid;
    display: flex; align-items: flex-start; gap: 0.7rem;
}
.box i { font-size: 1.2rem; flex-shrink: 0; margin-top: 0.15rem; }
.box-tip { background: var(--bleu-clair); border-color: var(--bleu); color: #0a2c5c; }
.box-important { background: var(--orange-clair); border-color: var(--orange); color: #6b3a1f; }
.box-success { background: var(--vert-clair); border-color: var(--vert); color: #064e3b; }
.box-warning { background: var(--rouge-clair); border-color: var(--rouge); color: #7f1d1d; }
.box-info { background: var(--violet-clair); border-color: var(--violet); color: #3b0764; }
.box-spectaculaire {
    background: linear-gradient(135deg, var(--orange-clair) 0%, #fff8f3 100%);
    border-color: var(--orange);
    color: #6b3a1f;
    font-size: 1.2rem;
    padding: 1.4rem 1.8rem;
}

/* ===== PRATIQUE ===== */
.slide-pratique { background: #f0fdf4; }
.pratique-etapes {
    background: white; border-radius: 14px; padding: 1.5rem 2rem;
    border: 2px solid var(--vert); margin-top: 1.2rem;
}
.check-item {
    display: flex; align-items: flex-start; gap: 0.7rem;
    padding: 0.7rem 0; border-bottom: 1px dashed var(--bordure);
}
.check-item:last-child { border-bottom: none; }
.check-item .num-circle {
    background: var(--vert); color: white; width: 30px; height: 30px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
}
.check-item .txt { font-size: 1.05rem; padding-top: 0.15rem; }
.check-item .txt strong { color: var(--bleu); }

/* ===== EXERCICE ===== */
.slide-exercice { background: #fff7ed; }

/* ===== SYNTHÈSE ===== */
.slide-synthese { background: #f5f3ff; }

/* ===== TABLEAU ===== */
.table-simple {
    width: 100%; border-collapse: collapse; font-size: 1.05rem;
    background: white; border-radius: 12px; overflow: hidden;
    margin: 1rem 0;
}
.table-simple th {
    background: var(--orange); color: white; padding: 0.8rem 1.1rem;
    text-align: left; font-weight: 700; font-size: 1rem;
}
.table-simple td { padding: 0.7rem 1.1rem; border-bottom: 1px solid var(--bordure); }
.table-simple tr:last-child td { border-bottom: none; }

/* ===== DÉMO URL ===== */
.url-demo {
    background: #1e293b; color: #86efac;
    padding: 1rem 1.4rem; border-radius: 10px;
    font-family: 'Consolas', monospace;
    font-size: 1.15rem; margin: 1rem 0;
    border-left: 4px solid var(--vert);
    text-align: center;
}

/* ===== PROMPT DÉMO ===== */
.prompt-demo {
    background: #f8fafc; border: 2px dashed var(--bleu);
    border-radius: 14px; padding: 1.5rem 1.8rem;
    margin: 1rem 0; font-family: 'Consolas', monospace;
    font-size: 1rem; line-height: 1.7; color: var(--texte);
}
.prompt-demo .var { color: var(--orange); font-weight: 700; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .slide-content { padding: 2rem 1.5rem; }
    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.4rem; }
    p, li { font-size: 1rem; }
    .bloc-plan { grid-template-columns: 1fr 1fr; }
    .access-card { padding: 2rem 1.5rem; }
    pre { font-size: 0.85rem; }
    .slide-header { font-size: 0.7rem; padding: 0.5rem 1rem; }
}
</style>
</head>
<body>

<!-- ÉCRAN DE CODE D'ACCÈS -->
<div class="access-overlay" id="accessOverlay">
    <div class="access-card">
        <div class="logo-symbol"><i class="fas fa-rocket"></i></div>
        <h2>Jour 3 · Créer et publier son site</h2>
        <p>Formation CDEJ · NTIC Solution<br>Saisissez le code d'accès.</p>
        <input type="password" class="access-input" id="accessInput" placeholder="Code d'accès" autocomplete="off" />
        <button class="access-btn" id="accessBtn"><i class="fas fa-rocket"></i> Commencer</button>
        <div class="access-error" id="accessError">Code incorrect. Réessayez.</div>
    </div>
</div>

<!-- CONTENEUR PROJECTION -->
<div class="presentation-container" id="presentationContainer">
    <div class="slide-header" id="slideHeader" style="display:none;">
        <div>
            <span class="bloc-tag" id="blocTag">BLOC 1</span>
            <span class="type-tag" id="typeTag">Cours</span>
        </div>
        <div class="num"><span id="slideNum">1</span> / <span id="slideTotal">20</span></div>
    </div>
    <div class="slide-stage" id="slideStage"></div>
    <div class="nav-hint">← → · Échap pour quitter</div>
</div>

<script>
// ============================================================
// SLIDES — JOUR 3 : CRÉER ET PUBLIER SON SITE (Pédagogie Quick Win)
// ============================================================
const slidesData = [

// ---------- SLIDE 1 : TITRE ----------
{
    type: 'title',
    bloc: '—',
    content: `
        <div class="badge-top"><i class="fas fa-bolt"></i> JOUR 3 · PÉDAGOGIE « RÉSULTAT D'ABORD »</div>
        <h1>Créer et publier son site</h1>
        <p class="lead">Aujourd'hui, vous repartez avec VOTRE site en ligne</p>
        <p class="lead" style="font-size:1.15rem; margin-top:1.5rem;">
            DeepSeek · VS Code · GitHub Pages · Lien public
        </p>
        <p class="meta">DURÉE : 2 HEURES · RÉSULTAT GARANTI À LA FIN</p>
    `,
    className: 'slide-title'
},

// ---------- SLIDE 2 : PLAN ----------
{
    type: 'cours',
    bloc: '—',
    content: `
        <div class="cours-content">
            <h2 class="anim-item">Le programme d'aujourd'hui</h2>
            <p class="anim-item" style="font-size:1.3rem;">Aujourd'hui, on inverse. <strong>D'abord le résultat, ensuite la compréhension.</strong></p>
            <div class="bloc-plan">
                <div class="bloc-item anim-item">
                    <div class="num">BLOC 1</div>
                    <h4>La démonstration</h4>
                    <p>Voir DeepSeek créer un site en 30 secondes.</p>
                    <span class="duree">30 min</span>
                </div>
                <div class="bloc-item anim-item">
                    <div class="num">BLOC 2</div>
                    <h4>Chacun son site</h4>
                    <p>Vous générez VOTRE site et le prévisualisez.</p>
                    <span class="duree">30 min</span>
                </div>
                <div class="bloc-item anim-item">
                    <div class="num">BLOC 3</div>
                    <h4>Mise en ligne</h4>
                    <p>Publication sur GitHub Pages.</p>
                    <span class="duree">30 min</span>
                </div>
                <div class="bloc-item anim-item">
                    <div class="num">BLOC 4</div>
                    <h4>Lien et célébration</h4>
                    <p>Chaque participant repart avec son URL.</p>
                    <span class="duree">30 min</span>
                </div>
            </div>
            <div class="box box-spectaculaire anim-item" style="margin-top:1.5rem;">
                <i class="fas fa-trophy"></i>
                <div><strong>Promesse de la journée :</strong> à 18h00, chaque participant aura envoyé à un proche le lien de son site web personnel, accessible partout dans le monde.</div>
            </div>
        </div>
    `,
    className: ''
},

// ---------- SLIDE 3 : POURQUOI CE CHANGEMENT ----------
{
    type: 'cours',
    bloc: 'BLOC 1',
    content: `
        <div class="cours-content">
            <h2 class="anim-item">Pourquoi ce changement de méthode ?</h2>
            <p class="anim-item">Après deux jours de théorie, voici ce que nous avons compris ensemble :</p>
            <table class="table-simple anim-item">
                <thead><tr><th>Ancienne approche</th><th>Nouvelle approche</th></tr></thead>
                <tbody>
                    <tr><td>Beaucoup de théorie</td><td>D'abord un résultat concret</td></tr>
                    <tr><td>Le site vient à la fin</td><td>Le site vient tout de suite</td></tr>
                    <tr><td>Difficile de voir où on va</td><td>On voit immédiatement le but</td></tr>
                   
                </tbody>
            </table>
            <div class="box box-tip anim-item">
                <i class="fas fa-lightbulb"></i>
                <div><strong>Principe :</strong> quand vous voyez votre site en ligne, vous voulez comprendre comment il fonctionne. C'est ça, la vraie motivation.</div>
            </div>
            <p class="anim-item" style="font-size:1.15rem; margin-top:1.5rem;">
                Les prochains jours, nous apprendrons à <strong>comprendre</strong> ce code, à le <strong>modifier</strong>, à le <strong>personnaliser</strong>. Mais aujourd'hui : <strong>l'avoir, en ligne</strong>.
            </p>
        </div>
    `,
    className: ''
},

// ---------- SLIDE 4 : QU'EST-CE QUE DEEPSEEK ----------
{
    type: 'cours',
    bloc: 'BLOC 1',
    content: `
        <div class="cours-content">
            <h2 class="anim-item">DeepSeek : l'IA qui écrit du code</h2>
            <p class="anim-item">DeepSeek est une intelligence artificielle gratuite. Elle comprend le français et génère du code HTML complet à partir d'une simple description.</p>
            <table class="table-simple anim-item">
                <thead><tr><th>Vous écrivez</th><th>DeepSeek produit</th></tr></thead>
                <tbody>
                    <tr><td>« Crée une page pour mon école »</td><td>Le code HTML complet de la page</td></tr>
                    <tr><td>« Ajoute une galerie de photos »</td><td>La section galerie en HTML + CSS</td></tr>
                    <tr><td>« Change les couleurs en bleu et or »</td><td>Le code avec les nouvelles couleurs</td></tr>
                </tbody>
            </table>
            <div class="box box-important anim-item">
                <i class="fas fa-robot"></i>
                <div><strong>Important :</strong> DeepSeek est un assistant, pas un remplaçant. Il écrit vite, mais c'est VOUS qui décidez, adaptez, personnalisez. Les prochains jours serviront à comprendre ce qu'il produit.</div>
            </div>
            <p class="anim-item" style="font-size:1.15rem;">
                🔗 Accès gratuit : <code>chat.deepseek.com</code>
            </p>
        </div>
    `,
    className: ''
},

// ---------- SLIDE 5 : DÉMONSTRATION LIVE ----------
{
    type: 'exercice',
    bloc: 'BLOC 1',
    content: `
        <div class="cours-content">
            <h2 class="anim-item" style="color:var(--orange);">🎬 Démonstration en direct</h2>
            <p class="anim-item" style="font-size:1.3rem;">
                Regardez bien ce que je fais à l'écran. Dans 30 minutes, vous ferez la même chose.
            </p>
            <div class="pratique-etapes anim-item" style="border-color:var(--orange);">
                <div class="check-item">
                    <div class="num-circle" style="background:var(--orange);">1</div>
                    <div class="txt">J'ouvre <code>chat.deepseek.com</code> dans le navigateur.</div>
                </div>
                <div class="check-item">
                    <div class="num-circle" style="background:var(--orange);">2</div>
                    <div class="txt">Je tape un prompt simple : <em>« Crée-moi une page d'accueil pour un site de développement web, avec un menu, une présentation et un bouton de contact. Utilise le bleu et l'orange. »</em></div>
                </div>
                <div class="check-item">
                    <div class="num-circle" style="background:var(--orange);">3</div>
                    <div class="txt">DeepSeek génère le code en quelques secondes.</div>
                </div>
                <div class="check-item">
                    <div class="num-circle" style="background:var(--orange);">4</div>
                    <div class="txt">Je copie le code, je l'ouvre dans VS Code.</div>
                </div>
                <div class="check-item">
                    <div class="num-circle" style="background:var(--orange);">5</div>
                    <div class="txt">Clic droit → <strong>Open with Live Server</strong>.</div>
                </div>

function renderSlide(index) {
    const stage = document.getElementById('slideStage');
    const slide = slidesData[index];
    stage.innerHTML = `<div class="slide-content ${slide.className || ''}">${slide.content}</div>`;

    const header = document.getElementById('slideHeader');
    if (slide.type === 'title' || slide.bloc === '—') {
        if (slide.type === 'title' || slide.className === 'slide-succes') {
            header.style.display = 'none';
            return;
        }
    }

    header.style.display = 'flex';
    document.getElementById('blocTag').textContent = slide.bloc || '—';
    document.getElementById('slideNum').textContent = index + 1;
    document.getElementById('slideTotal').textContent = totalSlides;

    const typeTag = document.getElementById('typeTag');
    const typeLabels = {
        'cours': 'Cours',
        'pratique': 'Pratique',
        'exercice': 'Exercice',
        'synthese': 'Synthèse',
        'succes': 'Succès'
    };
    typeTag.textContent = typeLabels[slide.type] || 'Cours';
    typeTag.className = 'type-tag type-' + (slide.type || 'cours');
}

function goNext() {
    if (currentSlide < totalSlides - 1) {
        currentSlide++;
        renderSlide(currentSlide);
    }
}

function goPrev() {
    if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
    }
}

function checkAccess() {
    const input = document.getElementById('accessInput');
    const error = document.getElementById('accessError');
    const expected = 'V0VCMjAyNg==';
    const entered = btoa(input.value.trim());
    if (entered === expected) {
        document.getElementById('accessOverlay').classList.add('hidden');
        document.getElementById('presentationContainer').classList.add('active');
        renderSlide(currentSlide);
    } else {
        error.classList.add('visible');
        input.value = '';
        input.focus();
        setTimeout(() => error.classList.remove('visible'), 2500);
    }
}

document.getElementById('accessBtn').addEventListener('click', checkAccess);
document.getElementById('accessInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkAccess();
});

// ============================================================
// NAVIGATION CLAVIER
// ============================================================
document.addEventListener('keydown', function(e) {
    const container = document.getElementById('presentationContainer');
    if (!container.classList.contains('active')) return;
    switch (e.key) {
        case 'ArrowRight':
        case ' ':
        case 'PageDown':
            e.preventDefault();
            goNext();
            break;
        case 'ArrowLeft':
        case 'PageUp':
            e.preventDefault();
            goPrev();
            break;
        case 'Escape':
            if (confirm('Quitter la projection ?')) {
                document.getElementById('presentationContainer').classList.remove('active');
                document.getElementById('accessOverlay').classList.remove('hidden');
                currentSlide = 0;
            }
            break;
    }
});

// ============================================================
// NAVIGATION TACTILE
// ============================================================
let touchStartX = 0;
document.addEventListener('touchstart', function(e) {
    touchStartX = e.changedTouches[0].screenX;
});
document.addEventListener('touchend', function(e) {
    const deltaX = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(deltaX) > 60) {
        if (deltaX < 0) goNext();
        else goPrev();
    }
});
</script>
