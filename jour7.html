<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTIC Solution · Jour 7 — Maîtrise professionnelle de l'IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
    --bleu: #0B3FA5;
    --bleu-profond: #072a6e;
    --bleu-clair: #e8f0fe;
    --orange: #FF6B35;
    --orange-clair: #fff4e5;
    --vert: #059669;
    --vert-clair: #ecfdf5;
    --violet: #7c3aed;
    --violet-clair: #f3e8ff;
    --rouge: #dc2626;
    --rouge-clair: #fef2f2;
    --jaune: #f59e0b;
    --jaune-clair: #fffbeb;
    --rose: #e91e63;
    --rose-clair: #fce4ec;
    --texte: #1e293b;
    --texte-secondaire: #475569;
    --blanc: #ffffff;
    --bordure: #e2e8f0;
    --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: var(--texte);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    -webkit-font-smoothing: antialiased;
}
.access-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: linear-gradient(135deg, var(--bleu) 0%, var(--bleu-profond) 100%);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.7s ease, visibility 0.7s ease;
}
.access-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.access-card {
    background: var(--blanc); border-radius: 2rem; padding: 3rem 2.5rem;
    text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    max-width: 460px; width: 90%; animation: floatIn 0.8s ease;
}
@keyframes floatIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.access-card .logo-symbol {
    background: var(--bleu); color: white; width: 68px; height: 68px;
    border-radius: 18px; display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; margin: 0 auto 1rem;
}
.access-card .brand {
    color: var(--orange);
    font-weight: 800;
    letter-spacing: 2px;
    font-size: 0.75rem;
    text-transform: uppercase;
    margin-bottom: 1rem;
}
.access-card h2 { color: var(--bleu); font-size: 1.4rem; margin-bottom: 0.5rem; font-weight: 800; }
.access-card p { color: var(--texte-secondaire); margin-bottom: 1.8rem; font-size: 0.9rem; line-height: 1.5; }
.access-input {
    width: 100%; padding: 0.9rem 1.3rem; border: 2px solid var(--bordure);
    border-radius: 14px; font-family: inherit; font-size: 1rem;
    text-align: center; letter-spacing: 2px; transition: var(--transition); margin-bottom: 1rem;
}
.access-input:focus { outline: none; border-color: var(--bleu); box-shadow: 0 0 0 4px rgba(11,63,165,0.15); }
.access-btn {
    width: 100%; padding: 0.9rem; background: var(--bleu); color: white;
    border: none; border-radius: 14px; font-weight: 700; font-size: 1rem;
    font-family: inherit; cursor: pointer; transition: var(--transition);
}
.access-btn:hover { background: var(--bleu-profond); transform: translateY(-2px); }
.access-error { color: var(--rouge); font-size: 0.85rem; margin-top: 0.5rem; display: none; font-weight: 600; }
.access-error.visible { display: block; animation: shake 0.5s ease; }
@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}
.presentation-container { display: none; position: fixed; inset: 0; background: #0d1117; z-index: 100; }
.presentation-container.active { display: block; }
.slide-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.slide-content {
    background: white; width: 100%; height: 100%;
    overflow-y: auto; padding: 3rem 4.5rem;
    position: relative; animation: slideIn 0.4s ease;
}
@keyframes slideIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
}
.slide-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
    padding: 0.6rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--bordure); font-size: 0.8rem; font-weight: 600;
}
.slide-header .bloc-tag {
    background: var(--bleu); color: white; padding: 0.25rem 0.75rem;
    border-radius: 999px; font-size: 0.7rem; letter-spacing: 0.5px;
}
.slide-header .type-tag {
    padding: 0.25rem 0.75rem; border-radius: 999px;
    font-size: 0.7rem; letter-spacing: 0.5px; font-weight: 700;
}
.type-cours { background: var(--bleu-clair); color: var(--bleu); }
.type-pratique { background: var(--vert-clair); color: var(--vert); }
.type-exercice { background: var(--orange-clair); color: var(--orange); }
.type-synthese { background: var(--violet-clair); color: var(--violet); }
.type-prompt { background: #fff7ed; color: #c2410c; }
.type-metier { background: var(--rose-clair); color: #c2185b; }
.type-strategie { background: var(--jaune-clair); color: #b45309; }
.slide-header .num { color: var(--texte-secondaire); }
.nav-hint {
    position: fixed; bottom: 1rem; right: 1rem; z-index: 500;
    color: rgba(255,255,255,0.3); font-size: 0.7rem;
    font-weight: 600; letter-spacing: 0.5px; pointer-events: none;
}
.anim-item { opacity: 0; transform: translateY(15px); animation: fadeUp 0.5s ease forwards; }
.anim-item:nth-child(1) { animation-delay: 0.05s; }
.anim-item:nth-child(2) { animation-delay: 0.15s; }
.anim-item:nth-child(3) { animation-delay: 0.25s; }
.anim-item:nth-child(4) { animation-delay: 0.35s; }
.anim-item:nth-child(5) { animation-delay: 0.45s; }
.anim-item:nth-child(6) { animation-delay: 0.55s; }
.anim-item:nth-child(7) { animation-delay: 0.65s; }
.anim-item:nth-child(8) { animation-delay: 0.75s; }
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; color: var(--bleu); line-height: 1.1; }
h2 { font-size: 2.1rem; font-weight: 700; color: var(--bleu); line-height: 1.2; margin-bottom: 1rem; }
h3 { font-size: 1.4rem; font-weight: 700; color: var(--texte); }
p { font-size: 1.15rem; line-height: 1.55; color: var(--texte); margin-bottom: 0.8rem; }
.lead { font-size: 1.4rem; color: var(--texte-secondaire); line-height: 1.5; }
.slide-title {
    background: linear-gradient(135deg, var(--bleu) 0%, var(--bleu-profond) 100%);
    color: white; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
}
.slide-title h1 { color: white; font-size: 3.2rem; }
.slide-title .lead { color: rgba(255,255,255,0.9); margin-top: 1rem; }
.slide-title .meta { color: rgba(255,255,255,0.65); font-size: 1rem; margin-top: 2rem; letter-spacing: 1px; }
.slide-title .badge-top {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
    padding: 0.4rem 1.1rem; border-radius: 999px; font-size: 0.8rem;
    font-weight: 700; letter-spacing: 1.5px; margin-bottom: 1.5rem;
}
.slide-title .ntic-brand {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.7);
    font-size: 0.85rem;
    letter-spacing: 1px;
}
.cours-content { max-width: 1050px; margin: 0 auto; }
.cours-content h2 { margin-bottom: 1.2rem; }

pre {
    background: #1e293b; color: #e2e8f0;
    padding: 1.2rem 1.4rem; border-radius: 12px;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 0.85rem; line-height: 1.7;
    overflow-x: auto; margin: 0.8rem 0;
    border-left: 4px solid var(--orange);
    white-space: pre;
    position: relative;
}
pre::before {
    content: attr(data-lang);
    position: absolute;
    top: 6px; right: 12px;
    font-size: 0.65rem;
    font-weight: 700;
    color: #64748b;
    letter-spacing: 1px;
    text-transform: uppercase;
}
pre .com { color: #64748b; font-style: italic; }
pre .kw { color: #f472b6; font-weight: 600; }
pre .str { color: #86efac; }
pre .hl { background: rgba(255,107,53,0.25); padding: 0.1rem 0.3rem; border-radius: 4px; }
code {
    background: #f1f5f9; padding: 0.15rem 0.4rem;
    border-radius: 4px; font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 0.85em; color: #db2777;
}

.prompt-box {
    background: #fff7ed;
    border: 2px solid var(--orange);
    border-radius: 14px;
    padding: 1.5rem;
    margin: 1rem 0;
    position: relative;
}
.prompt-box::before {
    content: '📋 PROMPT À COPIER';
    position: absolute;
    top: -12px;
    left: 20px;
    background: var(--orange);
    color: white;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 0.25rem 0.8rem;
    border-radius: 999px;
}
.prompt-box .prompt-content {
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 0.82rem;
    line-height: 1.75;
    color: #1e293b;
    white-space: pre-wrap;
    word-wrap: break-word;
}
.prompt-box .var {
    background: #fed7aa;
    color: #c2410c;
    font-weight: 700;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
}

.box {
    border-radius: 12px; padding: 1rem 1.4rem; margin: 1rem 0;
    font-size: 1rem; border-left: 5px solid;
    display: flex; align-items: flex-start; gap: 0.7rem;
}
.box i { font-size: 1.2rem; flex-shrink: 0; margin-top: 0.15rem; }
.box-tip { background: var(--bleu-clair); border-color: var(--bleu); color: #0a2c5c; }
.box-important { background: var(--orange-clair); border-color: var(--orange); color: #6b3a1f; }
.box-success { background: var(--vert-clair); border-color: var(--vert); color: #064e3b; }
.box-warning { background: var(--rouge-clair); border-color: var(--rouge); color: #7f1d1d; }
.box-info { background: var(--violet-clair); border-color: var(--violet); color: #3b0764; }

.slide-pratique { background: #f0fdf4; }
.slide-exercice { background: #fff7ed; }
.slide-synthese { background: #f5f3ff; }
.slide-prompt { background: #fff7ed; }
.slide-metier { background: #fce4ec; }
.slide-strategie { background: #fffbeb; }

.table-simple {
    width: 100%; border-collapse: collapse; font-size: 0.9rem;
    background: white; border-radius: 12px; overflow: hidden; margin: 1rem 0;
}
.table-simple th {
    background: var(--bleu); color: white; padding: 0.8rem 1.1rem;
    text-align: left; font-weight: 700; font-size: 0.85rem;
}
.table-simple td { padding: 0.65rem 1.1rem; border-bottom: 1px solid var(--bordure); }
.table-simple tr:last-child td { border-bottom: none; }

.ia-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.2rem;
    margin: 1.5rem 0;
}
.ia-card {
    background: white;
    border-radius: 16px;
    padding: 1.5rem 1.2rem;
    text-align: center;
    border: 2px solid var(--bordure);
    transition: transform 0.2s;
}
.ia-card:hover { transform: translateY(-4px); }
.ia-card i {
    font-size: 2.5rem;
    margin-bottom: 0.8rem;
    display: block;
}
.ia-card h4 {
    font-size: 1.1rem;
    margin-bottom: 0.4rem;
}
.ia-card p {
    font-size: 0.85rem;
    color: var(--texte-secondaire);
    margin: 0;
}
.ia-deepseek { border-top: 5px solid #4d6bfe; }
.ia-deepseek i { color: #4d6bfe; }
.ia-deepseek h4 { color: #4d6bfe; }
.ia-chatgpt { border-top: 5px solid #10a37f; }
.ia-chatgpt i { color: #10a37f; }
.ia-chatgpt h4 { color: #10a37f; }
.ia-gemini { border-top: 5px solid #4285f4; }
.ia-gemini i { color: #4285f4; }
.ia-gemini h4 { color: #4285f4; }

.strategie-num {
    display: inline-block;
    background: var(--jaune);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    line-height: 40px;
    text-align: center;
    font-weight: 800;
    font-size: 1.2rem;
    margin-right: 0.8rem;
    vertical-align: middle;
}

@media (max-width: 768px) {
    .slide-content { padding: 2rem 1.5rem; }
    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.4rem; }
    p { font-size: 1rem; }
    .access-card { padding: 2rem 1.5rem; }
    pre { font-size: 0.72rem; padding: 0.9rem 1rem; }
    .prompt-box .prompt-content { font-size: 0.72rem; }
    .slide-header { font-size: 0.7rem; padding: 0.5rem 1rem; }
    .ia-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

let currentSlide = 0;
const totalSlides = slidesData.length;

function renderSlide(index) {
    const stage = document.getElementById('slideStage');
    const slide = slidesData[index];
    stage.innerHTML = '<div class="slide-content ' + (slide.className || '') + '">' + slide.content + '</div>';

    const header = document.getElementById('slideHeader');
    if (slide.type === 'title') {
        header.style.display = 'none';
    } else {
        header.style.display = 'flex';
        document.getElementById('blocTag').textContent = slide.bloc || '—';
        document.getElementById('slideNum').textContent = index + 1;
        document.getElementById('slideTotal').textContent = totalSlides;

        const typeTag = document.getElementById('typeTag');
        const typeLabels = {
            'cours': 'Cours',
            'pratique': 'Pratique',
            'exercice': 'Exercice',
            'synthese': 'Synthèse',
            'prompt': 'Prompt',
            'metier': 'Métier',
            'strategie': 'Stratégie'
        };
        typeTag.textContent = typeLabels[slide.type] || 'Cours';
        typeTag.className = 'type-tag type-' + (slide.type || 'cours');
    }
}

function goNext() {
    if (currentSlide < totalSlides - 1) {
        currentSlide++;
        renderSlide(currentSlide);
    }
}

function goPrev() {
    if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
    }
}

function checkAccess() {
    const input = document.getElementById('accessInput');
    const error = document.getElementById('accessError');
    const expected = 'V0VCMjAyNg==';
    const entered = btoa(input.value.trim());

    if (entered === expected) {
        document.getElementById('accessOverlay').classList.add('hidden');
        document.getElementById('presentationContainer').classList.add('active');
        renderSlide(currentSlide);
    } else {
        error.classList.add('visible');
        input.value = '';
        input.focus();
        setTimeout(function() {
            error.classList.remove('visible');
        }, 2500);
    }
}

document.getElementById('accessBtn').addEventListener('click', checkAccess);
document.getElementById('accessInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkAccess();
});

document.addEventListener('keydown', function(e) {
    const container = document.getElementById('presentationContainer');
    if (!container.classList.contains('active')) return;
    switch (e.key) {
        case 'ArrowRight':
        case ' ':
        case 'PageDown':
            e.preventDefault();
            goNext();
            break;
        case 'ArrowLeft':
        case 'PageUp':
            e.preventDefault();
            goPrev();
            break;
        case 'Escape':
            if (confirm('Quitter la projection ?')) {
                document.getElementById('presentationContainer').classList.remove('active');
                document.getElementById('accessOverlay').classList.remove('hidden');
                currentSlide = 0;
            }
            break;
    }
});

let touchStartX = 0;
document.addEventListener('touchstart', function(e) {
    touchStartX = e.changedTouches[0].screenX;
});
document.addEventListener('touchend', function(e) {
    const deltaX = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(deltaX) > 60) {
        if (deltaX < 0) goNext();
        else goPrev();
    }
});
</script>
