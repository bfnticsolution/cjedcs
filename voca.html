<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anatomie d'un site professionnel — NTIC Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
:root {
    --bleu: #0B3FA5;
    --bleu-profond: #072a6e;
    --bleu-clair: #e8f0fe;
    --orange: #FF6B35;
    --orange-clair: #fff4e5;
    --vert: #059669;
    --vert-clair: #ecfdf5;
    --violet: #7c3aed;
    --violet-clair: #f3e8ff;
    --rouge: #dc2626;
    --rouge-clair: #fef2f2;
    --jaune: #f59e0b;
    --jaune-clair: #fffbeb;
    --texte: #1e293b;
    --texte-secondaire: #475569;
    --blanc: #ffffff;
    --bordure: #e2e8f0;
    --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: var(--texte);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    -webkit-font-smoothing: antialiased;
}
.access-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: linear-gradient(135deg, var(--bleu) 0%, var(--bleu-profond) 100%);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.7s ease, visibility 0.7s ease;
}
.access-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.access-card {
    background: var(--blanc); border-radius: 2rem; padding: 3rem 2.5rem;
    text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    max-width: 440px; width: 90%; animation: floatIn 0.8s ease;
}
@keyframes floatIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.access-card .logo-symbol {
    background: var(--bleu); color: white; width: 68px; height: 68px;
    border-radius: 18px; display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; margin: 0 auto 1.2rem;
}
.access-card h2 { color: var(--bleu); font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 800; }
.access-card p { color: var(--texte-secondaire); margin-bottom: 1.8rem; font-size: 0.92rem; line-height: 1.5; }
.access-input {
    width: 100%; padding: 0.9rem 1.3rem; border: 2px solid var(--bordure);
    border-radius: 14px; font-family: inherit; font-size: 1rem;
    text-align: center; letter-spacing: 2px; transition: var(--transition); margin-bottom: 1rem;
}
.access-input:focus { outline: none; border-color: var(--bleu); box-shadow: 0 0 0 4px rgba(11,63,165,0.15); }
.access-btn {
    width: 100%; padding: 0.9rem; background: var(--bleu); color: white;
    border: none; border-radius: 14px; font-weight: 700; font-size: 1rem;
    font-family: inherit; cursor: pointer; transition: var(--transition);
}
.access-btn:hover { background: var(--bleu-profond); transform: translateY(-2px); }
.access-error { color: var(--rouge); font-size: 0.85rem; margin-top: 0.5rem; display: none; font-weight: 600; }
.access-error.visible { display: block; animation: shake 0.5s ease; }
@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}
.presentation-container { display: none; position: fixed; inset: 0; background: #0d1117; z-index: 100; }
.presentation-container.active { display: block; }
.slide-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.slide-content {
    background: white; width: 100%; height: 100%;
    overflow-y: auto; padding: 3rem 4.5rem;
    position: relative; animation: slideIn 0.4s ease;
}
@keyframes slideIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
}
.slide-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
    padding: 0.6rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--bordure); font-size: 0.8rem; font-weight: 600;
}
.slide-header .bloc-tag {
    background: var(--bleu); color: white; padding: 0.25rem 0.75rem;
    border-radius: 999px; font-size: 0.7rem; letter-spacing: 0.5px;
}
.slide-header .type-tag {
    padding: 0.25rem 0.75rem; border-radius: 999px;
    font-size: 0.7rem; letter-spacing: 0.5px; font-weight: 700;
}
.type-cours { background: var(--bleu-clair); color: var(--bleu); }
.type-pratique { background: var(--vert-clair); color: var(--vert); }
.type-exercice { background: var(--orange-clair); color: var(--orange); }
.type-synthese { background: var(--violet-clair); color: var(--violet); }
.slide-header .num { color: var(--texte-secondaire); }
.nav-hint {
    position: fixed; bottom: 1rem; right: 1rem; z-index: 500;
    color: rgba(255,255,255,0.3); font-size: 0.7rem;
    font-weight: 600; letter-spacing: 0.5px; pointer-events: none;
}
.anim-item { opacity: 0; transform: translateY(15px); animation: fadeUp 0.5s ease forwards; }
.anim-item:nth-child(1) { animation-delay: 0.05s; }
.anim-item:nth-child(2) { animation-delay: 0.15s; }
.anim-item:nth-child(3) { animation-delay: 0.25s; }
.anim-item:nth-child(4) { animation-delay: 0.35s; }
.anim-item:nth-child(5) { animation-delay: 0.45s; }
.anim-item:nth-child(6) { animation-delay: 0.55s; }
.anim-item:nth-child(7) { animation-delay: 0.65s; }
.anim-item:nth-child(8) { animation-delay: 0.75s; }
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; color: var(--bleu); line-height: 1.1; }
h2 { font-size: 2.1rem; font-weight: 700; color: var(--bleu); line-height: 1.2; margin-bottom: 1rem; }
h3 { font-size: 1.4rem; font-weight: 700; color: var(--texte); }
h4 { font-size: 1.15rem; font-weight: 700; }
p { font-size: 1.2rem; line-height: 1.55; color: var(--texte); }
li { font-size: 1.1rem; line-height: 1.65; }
.lead { font-size: 1.4rem; color: var(--texte-secondaire); line-height: 1.5; }
.slide-title {
    background: linear-gradient(135deg, var(--bleu) 0%, var(--bleu-profond) 100%);
    color: white; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
}
.slide-title h1 { color: white; font-size: 3.2rem; }
.slide-title .lead { color: rgba(255,255,255,0.9); margin-top: 1rem; }
.slide-title .meta { color: rgba(255,255,255,0.65); font-size: 1rem; margin-top: 2rem; letter-spacing: 1px; }
.slide-title .badge-top {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
    padding: 0.4rem 1.1rem; border-radius: 999px; font-size: 0.8rem;
    font-weight: 700; letter-spacing: 1.5px; margin-bottom: 1.5rem;
}
.cours-content { max-width: 1050px; margin: 0 auto; }
.cours-content h2 { margin-bottom: 1.2rem; }
.cours-content p { margin-bottom: 1rem; }
.cours-content ul { padding-left: 1.5rem; margin-bottom: 1rem; }
.cours-content li { margin-bottom: 0.4rem; }
code {
    background: #f1f5f9; padding: 0.15rem 0.4rem;
    border-radius: 4px; font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.9em; color: #db2777;
}
.box {
    border-radius: 12px; padding: 1rem 1.4rem; margin: 1rem 0;
    font-size: 1.05rem; border-left: 5px solid;
    display: flex; align-items: flex-start; gap: 0.7rem;
}
.box i { font-size: 1.2rem; flex-shrink: 0; margin-top: 0.15rem; }
.box-tip { background: var(--bleu-clair); border-color: var(--bleu); color: #0a2c5c; }
.box-important { background: var(--orange-clair); border-color: var(--orange); color: #6b3a1f; }
.box-success { background: var(--vert-clair); border-color: var(--vert); color: #064e3b; }
.box-warning { background: var(--rouge-clair); border-color: var(--rouge); color: #7f1d1d; }
.box-info { background: var(--violet-clair); border-color: var(--violet); color: #3b0764; }
.slide-pratique { background: #f0fdf4; }
.slide-exercice { background: #fff7ed; }
.slide-synthese { background: #f5f3ff; }
.table-simple {
    width: 100%; border-collapse: collapse; font-size: 1rem;
    background: white; border-radius: 12px; overflow: hidden; margin: 1rem 0;
}
.table-simple th {
    background: var(--bleu); color: white; padding: 0.8rem 1.1rem;
    text-align: left; font-weight: 700; font-size: 0.95rem;
}
.table-simple td { padding: 0.7rem 1.1rem; border-bottom: 1px solid var(--bordure); }
.table-simple tr:last-child td { border-bottom: none; }

/* Anatomie visuelle d'un site */
.anatomie-site {
    background: #f8fafc;
    border-radius: 16px;
    padding: 1rem;
    border: 2px solid var(--bordure);
    margin: 1.5rem 0;
}
.zone {
    border-radius: 10px;
    padding: 1rem 1.2rem;
    margin-bottom: 0.8rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    color: white;
    font-weight: 700;
    font-size: 1rem;
    transition: transform 0.2s;
}
.zone:hover { transform: translateX(4px); }
.zone i { font-size: 1.3rem; }
.zone small {
    display: block;
    font-weight: 500;
    font-size: 0.78rem;
    opacity: 0.85;
    margin-top: 0.15rem;
}
.zone-header { background: linear-gradient(135deg, #4c1d95, #6d28d9); }
.zone-hero { background: linear-gradient(135deg, #0B3FA5, #1e40af); min-height: 90px; }
.zone-nav { background: linear-gradient(135deg, #c2410c, #ea580c); }
.zone-main { background: linear-gradient(135deg, #047857, #059669); min-height: 80px; }
.zone-aside { background: linear-gradient(135deg, #7c3aed, #a855f7); }
.zone-footer { background: linear-gradient(135deg, #334155, #475569); }
.zone-row {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 0.8rem;
    margin-bottom: 0.8rem;
}

/* Tableau des rôles HTML CSS JS */
.role-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-top: 1.5rem;
}
.role-card {
    border-radius: 14px;
    padding: 1.5rem 1.3rem;
    text-align: center;
    color: white;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}
.role-card.html { background: linear-gradient(135deg, #059669, #047857); }
.role-card.css { background: linear-gradient(135deg, #0B3FA5, #1e40af); }
.role-card.js { background: linear-gradient(135deg, #f59e0b, #d97706); }
.role-card i { font-size: 2.2rem; margin-bottom: 0.8rem; display: block; }
.role-card h4 { color: white; font-size: 1.2rem; margin-bottom: 0.5rem; }
.role-card p { color: rgba(255,255,255,0.92); font-size: 0.88rem; line-height: 1.5; margin: 0; }

/* Liste des fonctionnalités */
.fonctionnalites-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.9rem;
    margin-top: 1rem;
}
.fonction-item {
    background: white;
    border-radius: 12px;
    padding: 1rem 1.2rem;
    border-left: 4px solid var(--bleu);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    transition: transform 0.2s;
}
.fonction-item:hover { transform: translateX(4px); }
.fonction-item i {
    color: var(--bleu);
    font-size: 1.2rem;
    margin-top: 0.15rem;
    flex-shrink: 0;
}
.fonction-item h4 {
    font-size: 1rem;
    color: var(--texte);
    margin-bottom: 0.25rem;
}
.fonction-item p {
    font-size: 0.85rem;
    color: var(--texte-secondaire);
    line-height: 1.5;
    margin: 0;
}

@media (max-width: 768px) {
    .slide-content { padding: 2rem 1.5rem; }
    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.4rem; }
    p, li { font-size: 1rem; }
    .access-card { padding: 2rem 1.5rem; }
    .slide-header { font-size: 0.7rem; padding: 0.5rem 1rem; }
    .role-grid { grid-template-columns: 1fr; }
    .fonctionnalites-grid { grid-template-columns: 1fr; }
    .zone-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="access-overlay" id="accessOverlay">
    <div class="access-card">
        <div class="logo-symbol"><i class="fas fa-layer-group"></i></div>
        <h2>Anatomie d'un site professionnel</h2>
        <p>Formation CDEJ · NTIC Solution<br>Saisissez le code d'accès.</p>
        <input type="password" class="access-input" id="accessInput" placeholder="Code d'accès" autocomplete="off" />
        <button class="access-btn" id="accessBtn"><i class="fas fa-arrow-right"></i> Commencer</button>
        <div class="access-error" id="accessError">Code incorrect. Réessayez.</div>
    </div>
</div>

<div class="presentation-container" id="presentationContainer">
    <div class="slide-header" id="slideHeader" style="display:none;">
        <div>
            <span class="bloc-tag" id="blocTag">BLOC 1</span>
            <span class="type-tag" id="typeTag">Cours</span>
        </div>
        <div class="num"><span id="slideNum">1</span> / <span id="slideTotal">25</span></div>
    </div>
    <div class="slide-stage" id="slideStage"></div>
    <div class="nav-hint">← → · Échap pour quitter</div>
</div>

<script>
const slidesData = [

/* SLIDE 1 — TITRE */
{
    type: 'title',
    bloc: '—',
    content: '\
        <div class="badge-top"><i class="fas fa-layer-group"></i> COURS FONDAMENTAL</div>\
        <h1>Anatomie d\'un site professionnel</h1>\
        <p class="lead">Apprendre à nommer chaque partie pour savoir la demander</p>\
        <p class="meta">DURÉE : 2 HEURES · NIVEAU : DÉBUTANT</p>\
    ',
    className: 'slide-title'
},

/* SLIDE 2 — POURQUOI CE COURS */
{
    type: 'cours',
    bloc: '—',
    content: '\
        <div class="cours-content">\
            <h2 class="anim-item">Avant de demander, il faut savoir nommer</h2>\
            <p class="anim-item" style="font-size:1.25rem;">Pour obtenir un bon site d\'une IA, il faut savoir <strong>de quoi on parle</strong>. C\'est tout l\'objet de cette séance.</p>\
            <div class="box box-info anim-item" style="margin-top:2rem;">\
                <i class="fas fa-lightbulb"></i>\
                <div><strong>Imaginez un architecte</strong> qui ne connaît pas les mots « mur », « toit », « fenêtre ». Il ne pourrait rien commander. Pour un site, c\'est pareil : sans vocabulaire, pas de bon prompt.</div>\
            </div>\
            <p class="anim-item" style="margin-top:1.5rem; font-size:1.15rem;">À la fin de cette séance, vous saurez :</p>\
            <ul class="anim-item">\
                <li>Nommer <strong>chaque partie visible</strong> d\'un site (header, hero, footer…)</li>\
                <li>Distinguer le rôle du <strong>HTML</strong>, du <strong>CSS</strong> et du <strong>JavaScript</strong></li>\
                <li>Reconnaître les <strong>fonctionnalités</strong> possibles (formulaire, carrousel, calculatrice…)</li>\
                <li>Employer les <strong>bons termes</strong> dans un prompt</li>\
            </ul>\
        </div>\
    ',
    className: ''
},

/* SLIDE 3 — VUE D'ENSEMBLE */
{
    type: 'cours',
    bloc: 'BLOC 1',
    content: '\
        <div class="cours-content">\
            <h2 class="anim-item">Vue d\'ensemble — Les 6 zones d\'une page</h2>\
            <p class="anim-item">Toute page web professionnelle est construite avec les mêmes zones. Les voici, dans l\'ordre où elles apparaissent quand on descend dans la page.</p>\
            <div class="anatomie-site anim-item">\
                <div class="zone zone-header">\
                    <i class="fas fa-window-maximize"></i>\
                    <div>1. HEADER<small>Le bandeau en haut — logo + nom du site</small></div>\
                </div>\
                <div class="zone zone-nav">\
                    <i class="fas fa-bars"></i>\
                    <div>2. NAVIGATION (NAV)<small>Le menu — liens vers les autres pages</small></div>\
                </div>\
                <div class="zone zone-hero">\
                    <i class="fas fa-image"></i>\
                    <div>3. HERO<small>La grande bannière d\'accueil avec image et titre</small></div>\
                </div>\
                <div class="zone-row">\
                    <div class="zone zone-main" style="margin:0;">\
                        <i class="fas fa-align-left"></i>\
                        <div>4. MAIN<small>Le contenu principal — services, produits, texte</small></div>\
                    </div>\
                    <div class="zone zone-aside" style="margin:0;">\
                        <i class="fas fa-columns"></i>\
                        <div>5. ASIDE<small>Barre latérale (facultatif)</small></div>\
                    </div>\
                </div>\
                <div class="zone zone-footer" style="margin-bottom:0;">\
                    <i class="fas fa-shoe-prints"></i>\
                    <div>6. FOOTER<small>Le pied de page — contacts, réseaux, mentions</small></div>\
                </div>\
            </div>\
            <div class="box box-tip anim-item">\
                <i class="fas fa-lightbulb"></i>\
                <div><strong>Ces 6 zones sont universelles.</strong> Quel que soit le site (école, restaurant, boutique), on les retrouve toujours. Il suffit de savoir les nommer.</div>\
            </div>\
        </div>\
    ',
    className: ''
},

/* SLIDE 4 — HEADER */
{
    type: 'cours',
    bloc: 'BLOC 1',
    content: '\
        <div class="cours-content">\
            <h2 class="anim-item">1. Le HEADER — le bandeau d\'en-tête</h2>\
            <p class="anim-item">C\'est la <strong>première bande horizontale</strong> en haut de la page. Elle reste souvent visible quand on fait défiler (on dit qu\'elle est « sticky »).</p>\
            <table class="table-simple anim-item">\
                <thead><tr><th>Contient</th><th>Rôle</th></tr></thead>\
                <tbody>\
                    <tr><td>Le logo</td><td>Identité visuelle du site</td></tr>\
                    <tr><td>Le nom du site</td><td>Texte à côté du logo</td></tr>\
                    <tr><td>Le menu (nav)</td><td>Souvent intégré dans le header</td></tr>\
                    <tr><td>Le bouton de contact</td><td>Ou un bouton d\'action principal</td></tr>\
                </tbody>\
            </table>\
            <div class="box box-important anim-item">\
                <i class="fas fa-bookmark"></i>\
                <div><strong>Vocabulaire à utiliser dans un prompt :</strong> « un header sticky avec le logo à gauche et un menu à droite ».</div>\
            </div>\
        </div>\
    ',
    className: ''
},

/* SLIDE 5 — NAVIGATION */
{
    type: 'cours',
    bloc: 'BLOC 1',
    content: '\
        <div class="cours-content">\
            <h2 class="anim-item">2. La NAVIGATION (NAV) — le menu</h2>\
            <p class="anim-item">C\'est la zone qui permet de <strong>circuler entre les pages</strong> du site. Elle contient les liens cliquables vers les autres sections.</p>\
            <table class="table-simple anim-item">\
                <thead><tr><th>Type de menu</th><th>Description</th></tr></thead>\
                <tbody>\
                    <tr><td>Menu horizontal</td><td>Aligné sur une ligne — utilisé sur ordinateur</td></tr>\
                    <tr><td>Menu hamburger</td><td>Icône à 3 barres — utilisé sur mobile (il se déploie au clic)</td></tr>\
                    <tr><td>Menu déroulant</td><td>Sous-menu qui apparaît au survol</td></tr>\
                    <tr><td>Menu sticky</td><td>Reste visible quand on fait défiler</td></tr>\
                </tbody>\
            </table>\
            <div class="box box-tip anim-item">\
                <i class="fas fa-lightbulb"></i>\
                <div><strong>Vocabulaire à utiliser :</strong> « un menu horizontal sur desktop et un menu hamburger sur mobile », « un menu sticky qui reste visible au scroll ».</div>\
            </div>\
        </div>\
    ',
    className: ''
},

/* SLIDE 6 — HERO */
{
    type: 'cours',
    bloc: 'BLOC 1',
    content: '\
        <div class="cours-content">\
            <h2 class="anim-item">3. Le HERO — la bannière d\'accueil</h2>\
            <p class="anim-item">C\'est la <strong>grande zone visuelle</strong> juste après le header. Elle donne la première impression. C\'est souvent la partie la plus travaillée d\'un site.</p>\
            <table class="table-simple anim-item">\
                <thead><tr><th>Élément</th><th>Rôle</th></tr></thead>\
                <tbody>\
                    <tr><td>Image de fond</td><td>Photo ou illustration plein écran</td></tr>\
                    <tr><td>Overlay</td><td>Voile sombre qui rend le texte lisible</td></tr>\
                    <tr><td>Titre principal (H1)</td><td>Grande accroche en 4-6 mots</td></tr>\
                    <tr><td>Sous-titre</td><td>Une phrase qui précise l\'offre</td></tr>\
                    <tr><td>Bouton d\'action (CTA)</td><td>« Nous contacter », « Voir nos produits »…</td></tr>\
                </tbody>\
            </table>\
            <div class="box box-important anim-item">\
                <i class="fas fa-star"></i>\
                <div><strong>Vocabulaire à utiliser :</strong> « un hero avec image de fond, un overlay sombre, un titre H1, un sous-titre et un bouton d\'appel à l\'action ».</div>\
            </div>\
        </div>\
    ',
    className: ''
},

/* SLIDE 7 — MAIN */
{
    type: 'cours',
    bloc: 'BLOC 1',
    content: '\
        <div class="cours-content">\
            <h2 class="anim-item">4. Le MAIN — le contenu principal</h2>\

let currentSlide = 0;
const totalSlides = slidesData.length;

function renderSlide(index) {
    const stage = document.getElementById('slideStage');
    const slide = slidesData[index];
    stage.innerHTML = '<div class="slide-content ' + (slide.className || '') + '">' + slide.content + '</div>';

    const header = document.getElementById('slideHeader');
    if (slide.type === 'title') {
        header.style.display = 'none';
    } else {
        header.style.display = 'flex';
        document.getElementById('blocTag').textContent = slide.bloc || '—';
        document.getElementById('slideNum').textContent = index + 1;
        document.getElementById('slideTotal').textContent = totalSlides;

        const typeTag = document.getElementById('typeTag');
        const typeLabels = {
            'cours': 'Cours',
            'pratique': 'Pratique',
            'exercice': 'Exercice',
            'synthese': 'Synthèse'
        };
        typeTag.textContent = typeLabels[slide.type] || 'Cours';
        typeTag.className = 'type-tag type-' + (slide.type || 'cours');
    }
}

function goNext() {
    if (currentSlide < totalSlides - 1) {
        currentSlide++;
        renderSlide(currentSlide);
    }
}

function goPrev() {
    if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
    }
}

function checkAccess() {
    const input = document.getElementById('accessInput');
    const error = document.getElementById('accessError');
    const expected = 'V0VCMjAyNg==';
    const entered = btoa(input.value.trim());

    if (entered === expected) {
        document.getElementById('accessOverlay').classList.add('hidden');
        document.getElementById('presentationContainer').classList.add('active');
        renderSlide(currentSlide);
    } else {
        error.classList.add('visible');
        input.value = '';
        input.focus();
        setTimeout(function() {
            error.classList.remove('visible');
        }, 2500);
    }
}

document.getElementById('accessBtn').addEventListener('click', checkAccess);
document.getElementById('accessInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkAccess();
});

document.addEventListener('keydown', function(e) {
    const container = document.getElementById('presentationContainer');
    if (!container.classList.contains('active')) return;
    switch (e.key) {
        case 'ArrowRight':
        case ' ':
        case 'PageDown':
            e.preventDefault();
            goNext();
            break;
        case 'ArrowLeft':
        case 'PageUp':
            e.preventDefault();
            goPrev();
            break;
        case 'Escape':
            if (confirm('Quitter la projection ?')) {
                document.getElementById('presentationContainer').classList.remove('active');
                document.getElementById('accessOverlay').classList.remove('hidden');
                currentSlide = 0;
            }
            break;
    }
});

let touchStartX = 0;
document.addEventListener('touchstart', function(e) {
    touchStartX = e.changedTouches[0].screenX;
});
document.addEventListener('touchend', function(e) {
    const deltaX = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(deltaX) > 60) {
        if (deltaX < 0) goNext();
        else goPrev();
    }
});
</script>
